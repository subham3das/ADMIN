<!doctype html>
<html lang="en">
  <head>
    <script>
    (function () {
        // Retrieve the authenticated agent from storage
        const user = JSON.parse(localStorage.getItem("syndicate_admin_root"));

        // If no signal is detected or the role is not 'admin', redirect to terminal
        if (!user || user.role !== "admin") {
            // Optional: Only alert if they are actually trying to access a restricted sector
            alert("ACCESS DENIED: SECURE HANDSHAKE REQUIRED");
            window.location.href = "admin-login.html";
        }
        
        // Log for terminal debugging
        console.log("Terminal Uplink: Verified");
    })();
</script>
    <meta charset="UTF-8" />
    <title>SYNDICATE HQ | Moderation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #050505;
        color: #fff;
        overflow: hidden;
        height: 100vh;
      }
      .comic-font {
        font-family: "Bangers", cursive;
        letter-spacing: 0.05em;
      }
      .hq-container {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: 100vh;
      }

      /* SIDEBAR STYLE */
      .sidebar {
        background: #0a0a0a;
        padding: 2rem;
        display: flex;
        flex-direction: column;
      }
      .nav-link {
        padding: 12px 20px;
        border-radius: 12px;
        margin-bottom: 10px;
        font-weight: 800;
        text-transform: uppercase;
        font-size: 0.75rem;
        transition: 0.2s;
        border: 2px solid transparent;
        cursor: pointer;
        color: #666;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nav-link.active {
        background: #22c55e;
        color: #000;
        border-color: #000;
        box-shadow: 4px 4px 0px #fff;
        transform: translate(-2px, -2px);
      }
      .nav-link:hover:not(.active) {
        color: #fff;
      }

      .content-panel {
        overflow-y: auto;
        padding: 3rem;
        background: radial-gradient(circle at top right, #111, #050505);
      }
      .review-card {
        background: #000;
        border: 2px solid #111;
        border-radius: 1.5rem;
        transition: 0.2s;
      }
      .review-card:hover {
        border-color: #22c55e;
        background: #080808;
      }
    </style>
  </head>
  <body>
    <div class="hq-container">
      <aside class="sidebar">
        <div class="mb-12">
          <h1 class="comic-font text-3xl text-[#22c55e] italic leading-none">
            SYNDICATE
          </h1>
          <span
            class="text-[9px] font-black tracking-[0.4em] text-zinc-600 uppercase"
            >Archive Command</span
          >
        </div>
        <nav class="flex-grow">
          <a href="admin-hq.html" class="nav-link"><span>📡</span> OVERVIEW</a>
          <a href="admin-inventory.html" class="nav-link"
            ><span>📦</span> INVENTORY</a
          >
          <a href="admin-products.html" class="nav-link"
            ><span>🛠</span> PRODUCTS</a
          >
          <a href="admin-categories.html" class="nav-link"
            ><span>💰</span> CATEGORY</a
          >
          <a href="admin-orders.html" class="nav-link"
            ><span>👤</span> ORDERS</a
          >
          <a href="admin-reviews.html" class="nav-link active"
            ><span>⚖</span> REVIEWS</a
          >
        </nav>
      </aside>

      <main class="content-panel">
        <header class="mb-12">
          <h2 class="comic-font text-7xl uppercase leading-none italic">
            Moderation Hub
          </h2>
          <p
            class="text-zinc-500 font-bold text-sm mt-2 uppercase tracking-widest"
          >
            Verify or Terminate Citizen Transmissions
          </p>
        </header>

        <div id="reviews-feed" class="space-y-4"></div>
      </main>
    </div>

    <script>
      const API_URL = "https://backendmetro.vercel.app/api";
      // AUTH SIGNAL PROTOCOL
      const user = JSON.parse(localStorage.getItem("syndicate_admin_root"));

      window.onload = loadReviews;

      async function loadReviews() {
        try {
          const res = await fetch(`${API_URL}/admin/all-reviews`, {
            headers: { "admin-signal": user?.id || "" } // Handshake: Verified
          });
          const reviews = await res.json();
          const container = document.getElementById("reviews-feed");

          if (!reviews || reviews.length === 0) {
            container.innerHTML = `<p class="text-zinc-700 italic font-black uppercase text-center py-20">No transmissions detected in the archives.</p>`;
            return;
          }

          container.innerHTML = reviews
            .map(
              (r) => `
                    <div class="review-card p-6 flex justify-between items-center">
                        <div class="max-w-2xl">
                            <div class="flex items-center gap-3 mb-3">
                                <span class="bg-[#22c55e] text-black text-[8px] font-black px-2 py-0.5 rounded border border-black uppercase">${r.productName}</span>
                                <span class="text-yellow-400 text-xs">${"★".repeat(r.rating)}</span>
                            </div>
                            <p class="text-sm font-bold italic text-zinc-200">"${r.text}"</p>
                            <div class="mt-4 flex items-center gap-4">
                                <p class="text-[9px] text-zinc-500 uppercase font-black">— ${r.userName}</p>
                                <p class="text-[9px] text-zinc-700 font-mono">${new Date(r.date).toLocaleString()}</p>
                            </div>
                        </div>
                        <button onclick="terminateReview('${r.productId}', '${r.reviewId}')" class="bg-red-600/10 text-red-500 border border-red-900 px-6 py-3 rounded-xl text-[10px] font-black hover:bg-red-600 hover:text-white transition">WIPE SIGNAL</button>
                    </div>
                `,
            )
            .join("");
        } catch (err) {
          console.error("🚨 Handshake Failure");
        }
      }

      async function terminateReview(pid, rid) {
        if (!confirm("TERMINATE THIS CITIZEN TRANSMISSION PERMANENTLY?"))
          return;
        const res = await fetch(
          `${API_URL}/admin/products/${pid}/reviews/${rid}`,
          { 
            method: "DELETE",
            headers: { "admin-signal": user?.id || "" } // Authorize wipe
          },
        );
        if (res.ok) loadReviews();
      }
    </script>
  </body>

</html>
