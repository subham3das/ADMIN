<!doctype html>
<html lang="en">
  <head>
    <script>
    (function () {
        // Retrieve the authenticated agent from storage
        const user = JSON.parse(localStorage.getItem("syndicate_admin_root"));

        // If no signal is detected or the role is not 'admin', redirect to terminal
        if (!user || user.role !== "admin") {
            // Optional: Only alert if they are actually trying to access a restricted sector
            alert("ACCESS DENIED: SECURE HANDSHAKE REQUIRED");
            window.location.href = "admin-login.html";
        }
        
        // Log for terminal debugging
        console.log("Terminal Uplink: Verified");
    })();
</script>
    <meta charset="UTF-8" />
    <title>METROCLASSY HQ | Heist Manifest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #050505;
        color: #fff;
        overflow-x: hidden;
        height: 100vh;
      }
      .comic-font {
        font-family: "Bangers", cursive;
        letter-spacing: 0.05em;
      }
      .hq-container {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: 100vh;
      }

      .sidebar {
        background: #0a0a0a;
        border-right: 4px solid #111;
        padding: 2rem;
        display: flex;
        flex-direction: column;
      }
      .nav-link {
        padding: 12px 20px;
        border-radius: 12px;
        margin-bottom: 10px;
        font-weight: 800;
        text-transform: uppercase;
        font-size: 0.75rem;
        border: 2px solid transparent;
        cursor: pointer;
        color: #666;
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }
      .nav-link.active {
        background: #22c55e;
        color: #000;
        border-color: #000;
        box-shadow: 4px 4px 0px #fff;
      }

      .content-panel {
        overflow-y: auto;
        padding: 3rem;
        background: radial-gradient(circle at top right, #111, #050505);
      }
      .order-row {
        background: #0f0f0f;
        border: 3px solid #1a1a1a;
        border-radius: 1.5rem;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        transition: 0.3s;
      }

      .status-pill {
        padding: 4px 12px;
        border-radius: 99px;
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        border: 2px solid currentColor;
      }
      .st-progress {
        color: #fde047;
        background: rgba(253, 224, 71, 0.1);
      }
      .st-shipped {
        color: #3b82f6;
        background: rgba(59, 130, 246, 0.1);
      }
      .st-delivered {
        color: #22c55e;
        background: rgba(34, 197, 94, 0.1);
      }
      .st-dispatched {
        color: #a855f7;
        background: rgba(168, 85, 247, 0.1);
      }
      .st-transit {
        color: #fb923c;
        background: rgba(251, 146, 60, 0.1);
      }

      .terminal-btn {
        background: #000;
        border: 2px solid #222;
        padding: 8px 12px;
        border-radius: 10px;
        font-weight: 900;
        font-size: 9px;
        text-transform: uppercase;
        transition: 0.2s;
      }
      .terminal-btn:hover {
        background: #fff;
        color: #000;
      }

      .track-input {
        background: #000;
        border: 1px solid #333;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 9px;
        color: #22c55e;
        font-family: monospace;
        outline: none;
        width: 180px;
      }
      .track-input:focus {
        border-color: #22c55e;
      }

      .item-chip {
        background: #1a1a1a;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 800;
        border: 1px solid #333;
      }

      @media print {
        body {
          background: white !important;
          color: black !important;
          height: auto !important;
          overflow: visible !important;
        }
        .sidebar,
        .terminal-btn,
        header,
        .nav-link,
        button,
        .no-print,
        .uplink-zone {
          display: none !important;
        }
        .hq-container {
          display: block !important;
        }
        .content-panel {
          padding: 0 !important;
          background: none !important;
        }
        .order-row {
          border: 1px solid #eee !important;
          background: white !important;
          margin: 0 !important;
          padding: 40px !important;
          border-radius: 0 !important;
          page-break-after: always;
        }
        .comic-font {
          font-family: sans-serif !important;
          font-weight: bold !important;
          text-transform: uppercase;
        }
      }
    </style>
  </head>
  <body>
    <div class="hq-container">
      <aside class="sidebar">
        <div class="mb-12">
          <h1 class="comic-font text-3xl text-[#22c55e] italic leading-none">
            SYNDICATE
          </h1>
          <span
            class="text-[9px] font-black tracking-[0.4em] text-zinc-600 uppercase"
            >Archive Command</span
          >
        </div>
        <nav class="flex-grow">
          <a href="admin-hq.html" class="nav-link"><span>📡</span> OVERVIEW</a>
          <a href="admin-inventory.html" class="nav-link"
            ><span>📦</span> INVENTORY</a
          >
          <a href="admin-products.html" class="nav-link"
            ><span>🛠</span> PRODUCTS</a
          >
          <a href="admin-categories.html" class="nav-link"
            ><span>💰</span> CATEGORY</a
          >
          <a href="admin-orders.html" class="nav-link active"
            ><span>👤</span> ORDERS</a
          >
          <a href="admin-reviews.html" class="nav-link"
            ><span>⚖</span> REVIEWS</a
          >
        </nav>
      </aside>

      <main class="content-panel">
        <header class="flex justify-between items-end mb-12">
          <div>
            <h2 class="comic-font text-6xl uppercase">Heist Manifest</h2>
            <p
              class="text-zinc-500 font-bold text-sm tracking-widest uppercase"
            >
              Live Incoming Order Feed
            </p>
          </div>
        </header>

        <div id="order-list">
          <p
            class="text-center py-20 animate-pulse uppercase font-black text-zinc-800"
          >
            Establishing Database Handshake...
          </p>
        </div>
      </main>
    </div>

    <script>
      const API_URL = "https://backendmetro.vercel.app/api";
      // AUTH SIGNAL PROTOCOL
      const user = JSON.parse(localStorage.getItem("syndicate_admin_root"));

      window.onload = loadOrders;

      async function loadOrders() {
        try {
          const res = await fetch(`${API_URL}/admin/orders`, {
            headers: { "admin-signal": user?.id || "" } // Handshake: Verified
          });
          const orders = await res.json();
          renderOrders(orders);
        } catch (err) {
          console.error("Manifest Link Failed");
        }
      }

      function renderOrders(orders) {
        const container = document.getElementById("order-list");
        if (!orders || orders.length === 0) {
          container.innerHTML = `<p class="text-center py-20 font-black text-zinc-700 uppercase">No Active Deployments Found.</p>`;
          return;
        }

        container.innerHTML = orders
          .map((order) => {
            const date = new Date(order.date).toLocaleString("en-IN");
            const statusClass = getStatusClass(order.status);
            const finalAmount = order.totalAmount || order.total || 0;
            const isCOD = order.paymentMethod === "COD";

            return `
                <div class="order-row grid grid-cols-12 gap-6 items-start">
                    <div class="col-span-12 flex justify-between border-b border-zinc-900 pb-4 mb-2 print:border-black">
                        <div>
                            <p class="text-[10px] font-black text-zinc-500 uppercase">Mission Manifest</p>
                            <h4 class="font-mono text-xl font-black text-blue-500 print:text-black">#${order._id.slice(-8).toUpperCase()}</h4>
                            <p class="text-[9px] text-zinc-600 font-bold">${date}</p>
                        </div>
                        <div class="text-right">
                             <p class="text-[10px] font-black text-zinc-500 uppercase">Channel Status</p>
                             <p class="text-[10px] font-black ${isCOD ? "text-red-500" : "text-[#22c55e]"} uppercase print:text-black">
                                ${isCOD ? "● COLLECT AT DROP (COD)" : "● FULLY PAID (ONLINE)"}
                             </p>
                             <p class="text-xl comic-font text-white print:text-black mt-1">₹${finalAmount.toLocaleString("en-IN")}</p>
                        </div>
                    </div>

                    <div class="col-span-4">
                        <p class="text-[10px] font-black text-zinc-500 uppercase mb-2">Agent Intel</p>
                        <p class="text-sm font-black uppercase text-white print:text-black">${order.address.name}</p>
                        <p class="text-xs font-bold text-blue-400 print:text-black mb-1">${order.address.email || ""}</p>
                        <p class="text-sm font-black text-[#22c55e] print:text-black tracking-widest">${order.address.phone}</p>
                    </div>

                    <div class="col-span-4 border-l-2 border-zinc-900 pl-6 print:border-black">
                        <p class="text-[10px] font-black text-zinc-500 uppercase mb-2">Drop-Off Point</p>
                        <p class="text-[11px] font-bold text-zinc-300 leading-relaxed uppercase print:text-black">
                            ${order.address.addr}<br>
                            ${order.address.landmark ? "Landmark: " + order.address.landmark + "<br>" : ""}
                            ${order.address.city}, ${order.address.state} - ${order.address.pin}
                        </p>
                    </div>

                    <div class="col-span-4 border-l-2 border-zinc-900 pl-6 print:border-black">
                        <div class="flex justify-between items-start mb-2">
                             <p class="text-[10px] font-black text-zinc-500 uppercase">Gear Loadout</p>
                             <span class="status-pill ${statusClass}">${order.status}</span>
                        </div>
                        <div class="flex flex-wrap gap-2 mb-4">
                            ${order.items.map((item) => `<span class="item-chip text-white print:text-black">${item.name} | ${item.size} | x${item.quantity}</span>`).join("")}
                        </div>
                        
                        <div class="uplink-zone mt-4 border-t border-zinc-800 pt-4 no-print">
                            <p class="text-[8px] font-black text-zinc-600 uppercase mb-2">Tracking URL Uplink</p>
                            <div class="flex gap-2">
                                <input type="text" id="track-${order._id}" value="${order.trackingLink || ""}" placeholder="Paste Courier Link..." class="track-input">
                                <button onclick="saveTrackingLink('${order._id}')" class="bg-[#22c55e] text-black text-[8px] font-black px-3 py-1 rounded hover:bg-white transition">SYNC</button>
                            </div>
                        </div>
                    </div>

                    <div class="col-span-12 mt-4 pt-4 border-t border-zinc-900 flex justify-between items-center no-print">
                        <div class="flex flex-wrap gap-2">
                            <button class="terminal-btn" onclick="updateStatus('${order._id}', 'Progress')">Progress</button>
                            <button class="terminal-btn" onclick="updateStatus('${order._id}', 'Dispatched')">Dispatched</button>
                            <button class="terminal-btn" onclick="updateStatus('${order._id}', 'Shipped')">Shipped</button>
                            <button class="terminal-btn" onclick="updateStatus('${order._id}', 'In Transit')">Transit</button>
                            <button class="terminal-btn text-[#22c55e] border-[#22c55e]/30" onclick="updateStatus('${order._id}', 'Delivered')">Complete</button>
                            <button class="terminal-btn text-red-500 border-red-900/30 hover:bg-red-600" onclick="abortMission('${order._id}')">Abort</button>
                        </div>
                        <button class="text-[10px] font-black uppercase text-blue-400 underline hover:text-white" onclick="window.print()">Print Official Invoice</button>
                    </div>
                </div>
                `;
          })
          .join("");
      }

      async function saveTrackingLink(id) {
        const link = document.getElementById(`track-${id}`).value.trim();
        const res = await fetch(`${API_URL}/admin/orders/${id}/link`, {
          method: "PATCH",
          headers: { 
            "Content-Type": "application/json",
            "admin-signal": user?.id || "" // Authorize
          },
          body: JSON.stringify({ link }),
        });
        if (res.ok) {
          if (window.navigator.vibrate) window.navigator.vibrate([30, 20, 30]);
          alert("COURIER SIGNAL SYNCED");
        }
      }

      function getStatusClass(s) {
        const status = (s || "progress").toLowerCase();
        switch (status) {
          case "progress":
            return "st-progress";
          case "dispatched":
            return "st-dispatched";
          case "shipped":
            return "st-shipped";
          case "in transit":
            return "st-transit";
          case "delivered":
            return "st-delivered";
          default:
            return "st-progress";
        }
      }

      async function updateStatus(id, status) {
        if (window.navigator.vibrate) window.navigator.vibrate(10);
        await fetch(`${API_URL}/admin/orders/${id}/status`, {
          method: "PATCH",
          headers: { 
            "Content-Type": "application/json",
            "admin-signal": user?.id || "" // Authorize
          },
          body: JSON.stringify({ status }),
        });
        loadOrders();
      }

      async function abortMission(id) {
        if (!confirm("WIPE MISSION DATA? Action cannot be undone.")) return;
        await fetch(`${API_URL}/admin/orders/${id}`, { 
          method: "DELETE",
          headers: { "admin-signal": user?.id || "" } // Authorize
        });
        loadOrders();
      }
    </script>
  </body>

</html>
